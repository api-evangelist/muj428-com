conformance:
  spec: A2A 1.0.0
  grade: flavored
  protocol_version: null
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: false
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications, extendedAgentCard and an extensions[] array of two objects. skills is an ARRAY (pass)
    of eleven skills with id, name, description and tags. protocolVersion is ABSENT at the top level (FAIL):
    the only protocol version statements are per-interface protocolVersion "1.0" entries inside
    supportedInterfaces[] and the extension descriptor's protocolVersions ["1.0","0.3"]. One hard-check
    failure makes the grade flavored (0.25 credit), not near-conformant — the card is an A2A card in spirit
    and in most of its structure, but a reader validating against the 1.0.0 schema will reject it.
  deviations:
  - field: protocolVersion
    observed: absent
    note: >-
      No top-level protocolVersion. The card's supportedInterfaces[0].protocolVersion is "1.0" and the
      extension descriptor says protocolVersions ["1.0","0.3"], so the provider evidently targets A2A 1.0,
      but the field the specification requires on the card itself is missing. This is the single defect
      standing between flavored and conformant.
  - field: url
    observed: absent
    note: >-
      No top-level url. The JSON-RPC endpoint (https://agents.muj428.com/a2a) is reachable only through
      supportedInterfaces[].url. A 0.3.x-era client that reads the top-level url has no endpoint to call.
  - field: supportedInterfaces
    observed: present (array of {protocolBinding, protocolVersion, url})
    note: >-
      The 1.0.0-shaped interface block is used rather than the 0.3.x url + preferredTransport +
      additionalInterfaces triple; the card commits to neither shape completely (1.0.0 block present,
      1.0.0 protocolVersion missing). Recorded because both card shapes coexist in the catalog.
  - field: securitySchemes / security
    observed: absent
    note: >-
      The card declares no authentication scheme, which matches the surface: free Trust Reflex calls need
      no credential, and paid skills are gated by x402 payment (HTTP 402 then retry with PAYMENT-SIGNATURE),
      an economic gate rather than an authentication scheme. An agent cannot learn the payment model from
      securitySchemes; it has to read the Trust Reflex extension params (productionPriceUSDC, network
      eip155:8453, paymentDiscovery, paymentProof).
  - field: capabilities.extensions[].uri
    observed: https://agents.muj428.com/.well-known/muj428-trust-kernel.json and https://agents.muj428.com/extensions/trust-reflex/v1
    note: >-
      Both extension URIs resolve (200) to real JSON descriptors on the provider's host; the Trust Reflex
      descriptor names its activation header and the trust/evaluate RPC method. This is the card's
      domain-standard signature for agent-trust preflight — see conformance/muj428-com-conformance.yml.
  - field: productHierarchy / documentationUrl
    observed: provider-specific productHierarchy object present; documentationUrl points at the facade's /discover JSON
    note: productHierarchy is a non-standard top-level key (harmless to validators that ignore unknown keys); documentationUrl resolves to a machine discovery document rather than human docs.
  - field: /.well-known/agent.json (legacy path)
    observed: 200 with a DIFFERENT document shape (capabilities as an array of strings, an endpoints map, no skills[])
    note: >-
      Two documents with two shapes at the two discovery paths. A client that reads the legacy path first
      sees a card that fails every hard check (capabilities not an object, no skills array); one that reads
      the canonical path sees the flavored card above.
surface_relationship:
  note: >-
    MUJ428 publishes three agent surfaces that are projections of one 24-operation REST facade: A2A (this
    card, eleven skills, JSON-RPC at agents.muj428.com/a2a behind the Trust Reflex extension), MCP (14 tools
    at the canonical Supabase endpoint plus a 2-tool compatibility facade at agents.muj428.com/mcp — see
    mcp/muj428-com-mcp.yml), and REST (openapi/muj428-com-trust-layer-openapi.json). Every skill and every
    tool maps to a REST operationId — the binding is recorded in mcp/muj428-com-tool-crosswalk.yml.
