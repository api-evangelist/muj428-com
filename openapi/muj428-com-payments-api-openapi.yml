openapi: 3.2.0
info:
  title: Muj428 Com Payments API
  version: '1.0'
  description: 'Operations tagged Payments across 2 of this provider''s published API definitions: muj428-com-trust-layer-openapi-agents-mirror.json, muj428-com-trust-layer-openapi-facade.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer
tags:
- name: Payments
paths:
  /v1/payments/select:
    post:
      operationId: selectPaymentPlan
      summary: Select an eligible payment plan without moving funds
      description: Checks whether the requested plan and optional authorization overlay are eligible for Trust Reflex preflight. Success is not payment authorization or execution authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rail:
                  type: string
                  enum:
                  - x402
                  - mpp
                  - stablecoin-multinetwork
                  - streaming-micropayments
                  - tokenized-deposit
                authorization_protocol:
                  type: string
                  enum:
                  - muj428-trust-receipt
                  - ap2
                base_rail:
                  type: string
                asset:
                  type: string
                network:
                  type: string
      responses:
        '200':
          description: Plan eligible for trust preflight
        '409':
          description: Plan unavailable, unverified, or outside its verified scope
      tags:
      - Payments
    servers:
    - url: https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer
  /v1/payments/capabilities:
    get:
      summary: Discover payment rails and activation state
      responses:
        '200':
          description: No-money payment capability discovery
      tags:
      - Payments
      operationId: getV1PaymentsCapabilities
      x-operation-id-source: derived
    servers:
    - url: https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer
x-refined-from:
- muj428-com-trust-layer-openapi-agents-mirror.json
- muj428-com-trust-layer-openapi-facade.json
