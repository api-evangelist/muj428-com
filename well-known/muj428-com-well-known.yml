source: live probes of /.well-known/ on every MUJ428 host (agents.muj428.com, muj428.com, www.muj428.com, wepmhfjzckclvywolrek.supabase.co)
summary: >-
  agents.muj428.com is one of the richest /.well-known/ trees in the catalog: an RFC 9727 api-catalog served
  with the correct application/linkset+json media type and profile, an MCP server.json at /.well-known/mcp.json,
  an A2A agent card at both the canonical and legacy paths, an agent402 service manifest at /.well-known/x402,
  and a dozen provider-specific documents (Trust Kernel pointer, payment rails, payment proof, trust boundary,
  trust gravity, product architecture, N428 manifests, agent-permissions, a legacy MCP server card). What it
  does NOT serve: security.txt (no SecurityTxt pointer), OIDC discovery, RFC 8414 authorization-server or
  RFC 9728 protected-resource metadata (no OAuth anywhere), ai-plugin.json, apis.json. The apex muj428.com and
  www.muj428.com 302 every path to a Porkbun parking page (muj428-com.l.ink) that 404s, and the Supabase
  project root 404s everything — the facade's agent card lives under the function path, not a well-known root.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the 200s on agents.muj428.com (api-catalog, mcp.json, agent-card.json
  and the rest). APICatalog pointer emitted for the RFC 9727 document. SecurityTxt pointer NOT emitted — RFC 9116
  is unimplemented on every host (404 at /.well-known/security.txt and /security.txt).
false_positive_watch: >-
  agents.muj428.com is NOT a catch-all: a negative-control path (/.well-known/apievangelist-negative-control-7f3a9c.json)
  and every unimplemented standard path return a real, small HTML 404 (144-193 bytes). muj428.com / www.muj428.com
  answer 302 for everything and must never be read as hits.
