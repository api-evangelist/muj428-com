summary: >-
  MUJ428 publishes no test-mode keys (it has no keys at all) and no fake cards or wallets; what it publishes is
  three zero-money ways to exercise the surface, all documented and all confirmed live on 2026-09-19. (1) The FREE
  PREFLIGHT itself: the first 1,000 qualifying Trust Reflex decisions per stable caller_ref cost $0.00 with no
  card, wallet, contract or signup, return a real decision and Trust Receipt with payment_required=false and
  execution_authority=false, and move nothing. (2) The External Verified Effect Conformance Sandbox
  (TESTNET_CONFORMANCE): a two-step authorize -> execute flow on agents.muj428.com that lets an external runtime
  prove it can obtain, carry and consume an authenticated action-bound receipt and receive a COMMITTED Verified
  Effect, then have a replay denied — forbidden effects payment, fund_transfer, wallet_signing, external_write;
  moves_money false. (3) DECISION-DELTA-TEST, a shadow-only comparison guide ("preview_by_default true, automatic
  payment false"). Planning-only calls (POST /v1/payments/select, MCP select_assurance_tier) quote or check without
  charging. Verbatim contract: sandbox/muj428-com-integration-sandbox.json.
