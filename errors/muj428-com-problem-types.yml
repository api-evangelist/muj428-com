request_id: >-
  The facade exposes X-Request-Id (access-control-expose-headers) and accepts x-request-id from the caller;
  every response also carries a Supabase sb-request-id (observed, e.g. 01a0bc8f-68f1-7194-9be7-59632f480fc3).
  Quote either when reporting a problem to sales@muj428.com.
problems:
  - status: 402
    title: Payment Required (x402)
    media_type: application/json
    operations: [trustAction, evidenceSignal, reputationCheck, milestoneAttestation, trustLayerReport, transactionAssurance]
    meaning: >-
      The request is valid but unpaid: on /v1/trust the caller_ref has exhausted its 1,000 free qualifying decisions;
      on the five paid services every call is priced. Per the provider's x402_flow the response carries a
      PAYMENT-REQUIRED header with the exact amount, network (eip155:8453), asset (USDC) and seller.
    remediation: >-
      Have the caller — never MUJ428 — authorize the payment under its own wallet policy, then retry the SAME request
      with a valid PAYMENT-SIGNATURE header. The success response carries PAYMENT-RESPONSE. Paid continuation of Trust
      Reflex requires explicit caller authorization; there is no automatic charge.
    source: OpenAPI 402 descriptions; https://agents.muj428.com/developer.json x402_flow
  - status: 409
    title: Conflict
    media_type: application/json
    operations: [createContinuousTrustMonitor, selectPaymentPlan]
    meaning: 'POST /v1/monitor: "Monitor already exists" for the source receipt. POST /v1/payments/select: "Plan unavailable, unverified, or outside its verified scope".'
    remediation: For a monitor, reuse the existing one; for a plan, read /.well-known/payment-rails.json and /.well-known/payment-proof.json to pick a rail whose production_verified scope covers the requested mode.
  - status: 422
    title: Invalid request
    media_type: application/json
    operations: [trustAction, evidenceSignal, reputationCheck, milestoneAttestation, trustLayerReport, transactionAssurance, resolveTrustRoute, registerTrustCompatibility, rescueAgentBeforeConsequence, createContinuousTrustMonitor]
    meaning: >-
      Missing or malformed required fields — on /v1/trust the minimum is caller_ref (>=3 chars), action_ref (>=3 chars) and
      action (one of the ten-value enum); on /v1/monitor also "invalid source receipt or no matching accepted Trust Reflex
      invocation"; on /v1/rescue "invalid or unclassifiable request". The canonical request shape is FLAT (action is a string
      and action-specific fields are top-level); legacy nested action objects are accepted and normalized.
    remediation: Send the flat shape from AGENTS.md; if the intent does not fit the enum, resolve it through POST /v1/route first (the 422 from that endpoint echoes allowed_actions) rather than inventing an action value.
  - status: 429
    title: Rate limited
    media_type: application/json
    operations: [rescueAgentBeforeConsequence]
    meaning: Declared only on POST /v1/rescue ("Rate limited"); no limit number and no Retry-After header is documented.
    remediation: Back off and retry; see rate-limits/muj428-com-rate-limits.yml.
  - status: 503
    title: Production dependency unavailable
    media_type: application/json
    operations: [trustAction, evidenceSignal, reputationCheck, milestoneAttestation, trustLayerReport, transactionAssurance, getHealth]
    meaning: 'A production dependency is down. The spec is explicit about the fail-closed semantics: "failure is never ALLOW".'
    remediation: Treat as a BLOCK for the pending consequential action; poll GET /health (facilitator_ready, ledger_ready, production_ready flags) before retrying.
  - status: 428
    title: Precondition Required (MUJ428-Receipt-Required)
    media_type: application/json
    operations: []
    meaning: >-
      Not a facade response — the Trust Gravity advertisement documents 428 as the http_status_signal a receipt-aware
      EXECUTOR returns (header MUJ428-Receipt-Required: v1.3, body {"trust_protocol":"muj428","receipt_required":true,
      "receipt_version":"1.3"}) when an agent attempts a consequential action without a Trust Receipt. Recorded so an
      agent recognises the signal when a third-party executor emits it.
    remediation: Obtain a Trust Receipt via POST /v1/trust and present it at the executor's mutation boundary.
    source: well-known/muj428-com-muj428-trust-gravity.json receipt_required_advertisement
  - status: 404
    title: Not found
    media_type: application/json
    meaning: Unknown facade path; body carries a discover link.
    remediation: Follow the discover URL or the api-catalog.
  - status: 405
    title: Method not allowed
    operations: []
    meaning: GET on https://agents.muj428.com/mcp — the MCP facade is POST-only.
    remediation: POST JSON-RPC 2.0 with Accept application/json, text/event-stream.
  - status: 406
    title: Not acceptable
    operations: []
    meaning: GET on the canonical MCP endpoint without an MCP request.
    remediation: Same as 405.
decision_semantics:
  note: >-
    Not errors, but easy to misread as them: the Trust Reflex 200 body carries a DECISION (ALLOW, VERIFY, REQUIRE_VERIFICATION,
    DENY; wire-compatible with the public EXECUTE / REQUIRE_MORE_EVIDENCE / BLOCK envelope) and payment_required=false while
    free quota remains. A DENY is a successful 200. Free-preflight receipts carry execution_authority=false by design.
