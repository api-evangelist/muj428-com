aid: muj428-com
name: MUJ428 LLC
description: >-
  MUJ428 LLC operates the MUJ428 Trust Layer ("VERIFY BEFORE ACT"), a machine-native trust preflight
  service for autonomous agents: an agent POSTs the consequential action it is about to take (PAY, BUY,
  DELEGATE, TRUST, ACCEPT, APPROVE, WRITE, RELEASE, COMMIT, PROPOSE) and receives an ALLOW / VERIFY /
  REQUIRE_VERIFICATION / DENY decision plus a portable Trust Receipt v1.3, while the caller keeps
  execution authority and MUJ428 never moves funds. The first 1,000 qualifying decisions per caller_ref
  are free with no account, key or wallet; paid continuation and the evidence-signal, reputation-check,
  milestone-attestation, trust-report and transaction-assurance services are settled in USDC on Base
  (eip155:8453) through x402. The same surface is published as a 24-operation OpenAPI 3.1 REST facade
  hosted on Supabase edge functions, a remote Streamable-HTTP MCP server listed in the official MCP
  registry, an A2A agent card with a Trust Reflex extension, an RFC 9727 api-catalog, an llms.txt,
  AGENTS.md and a tarball-distributed JavaScript client, all discoverable from agents.muj428.com.
