apis:
- aid: muj428-com:muj428-trust-layer-mcp-server
  name: MUJ428 Trust Layer MCP Server
  description: >-
    Remote Model Context Protocol server, Streamable HTTP, POST only, at https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer-mcp
    (protocol version 2025-06-18, serverInfo "MUJ428 Trust Layer — VERIFY BEFORE ACT" 1.8.3). initialize
    and tools/list answer anonymously with 14 tools carrying real JSON Schema 2020-12 inputSchemas: trust_action,
    rescue_agent_before_consequence, invoke_trust_service, get_service_catalog, get_payment_rails, resolve_trust_route,
    get_trust_heartbeat, find_trust_capabilities, publish_trust_request, observe_trust_compatibility,
    select_payment_rail, get_trust_layer_pricing, select_assurance_tier and get_capabilities; resources/list
    and prompts/list return -32601. A second, older compatibility facade answers at https://agents.muj428.com/mcp
    (serverInfo 1.7.1, two tools) and is the remote the official MCP registry entry io.github.wmujahid428-web/muj428-trust-layer
    lists; the provider's own server card marks it canonical: false. Discovery documents: /.well-known/mcp.json
    (server.json shape) and /mcp/server-card (application/mcp-server-card+json) on agents.muj428.com.
  humanURL: https://agents.muj428.com/.well-known/mcp.json
  baseURL: https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer-mcp
