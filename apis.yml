apis:
- aid: muj428-com:muj428-trust-layer-api
  name: MUJ428 Trust Layer API
  description: >-
    REST facade for the MUJ428 Trust Layer, served as Supabase edge functions at
    https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer and named as the canonical
    production facade by the provider's own api-catalog, agent card, mcp.json, AGENTS.md and developer.json
    on agents.muj428.com. POST /v1/trust is the Trust Reflex preflight (flat JSON: caller_ref, action_ref,
    action) returning a decision and Trust Receipt v1.3; /v1/route resolves an intent into the supported
    action vocabulary; /v1/rescue is the Agent Rescue Beacon; /v1/monitor creates Continuous Trust
    Monitoring from a prior receipt; /v1/evidence-signal, /v1/reputation-check, /v1/milestone-attestation,
    /v1/trust-layer-report and /v1/transaction-assurance are x402-paid (HTTP 402 with PAYMENT-REQUIRED,
    retry with PAYMENT-SIGNATURE); /discover, /services, /pricing.json, /health, /v1/heartbeat,
    /v1/compatibility, /v1/trust-requests, /v1/loop/status and the payment-rail documents are anonymous
    reads. OpenAPI 3.1.0, 24 operations, no securitySchemes (free calls need no credential).
  humanURL: https://agents.muj428.com/
  baseURL: https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer
  tags:
