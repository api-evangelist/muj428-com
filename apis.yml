- aid: muj428-com:muj428-trust-reflex-a2a-agent
  name: MUJ428 Trust Reflex A2A Agent
  description: >-
    Agent2Agent surface: an agent card served from https://agents.muj428.com/.well-known/agent-card.json
    (name "MUJ428 Trust Reflex", version 1.8.3, provider MUJ428 LLC) declaring eleven skills — agent rescue
    beacon, trust reflex, evidence signal, reputation check, milestone attestation, trust report, transaction
    assurance, payment-plan discovery, agent router, heartbeat and trust requests — and two capability
    extensions (the MUJ428 Trust Kernel v1.0 and the Trust Reflex extension at https://agents.muj428.com/extensions/trust-reflex/v1,
    which adds a trust/evaluate JSON-RPC method activated with the A2A-Extensions header). supportedInterfaces
    names a JSONRPC binding at https://agents.muj428.com/a2a, which answers JSON-RPC 2.0 (an un-activated
    request returns -32600 asking for the extension header). The card omits protocolVersion and a top-level
    url, so it grades flavored against A2A 1.0.0. A canonical production copy with per-skill endpoints
    is also served at https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer/.well-known/agent-card.json.
  humanURL: https://agents.muj428.com/
  baseURL: https://agents.muj428.com/a2a
