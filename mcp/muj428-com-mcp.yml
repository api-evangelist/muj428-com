summary: >-
  MUJ428 operates TWO remote MCP servers, both Streamable HTTP, both answering initialize and tools/list
  anonymously. The CANONICAL one is a Supabase edge function at
  https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer-mcp (protocol 2025-06-18, serverInfo
  "MUJ428 Trust Layer — VERIFY BEFORE ACT" 1.8.3, 14 tools with JSON Schema 2020-12 inputSchemas;
  resources/list and prompts/list return -32601; a GET returns 406). A second, OLDER compatibility facade
  answers at https://agents.muj428.com/mcp (serverInfo "MUJ428 Trust Layer" 1.7.1, 2 tools, GET returns
  405) — it is the remote URL the official MCP registry entry lists (versions 1.0.0 and 1.6.2 published
  2026-08-10), while the provider's own /mcp/server-card marks it compatibilityFacade canonical: false.
  Authorship is provider: the tool names (trust_action, rescue_agent_before_consequence,
  publish_trust_request, select_assurance_tier) are MUJ428-specific and match no shared platform
  fingerprint; the server card's repository points at github.com/wmujahid428-web/muj428-a2a-revenue-engine,
  which returns 404 (private or removed — the user page shows no public repositories).
deployment:
  mode: remote
  endpoint: https://wepmhfjzckclvywolrek.supabase.co/functions/v1/trust-layer-mcp
  auth: none
  verified: probed
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly; MUJ428 ships no stdio package and AGENTS.md
    says "No package is required for the canonical REST or MCP production surfaces." auth is "none" in
    the connection sense — initialize and tools/list need no credential, and no OAuth metadata is served
    on any host (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource 404 on
    agents.muj428.com and on the Supabase project root). Paid tools (invoke_trust_service for the five
    x402 services, trust_action after the free quota) are gated by x402 PAYMENT — the tool returns the
    exact 402 challenge and accepts a caller-supplied payment_signature — which is an economic gate on
    invocation, not an authentication scheme. The compatibility facade at https://agents.muj428.com/mcp
    is a second remote endpoint, recorded below; deployment.endpoint names the one the provider calls
    canonical.
